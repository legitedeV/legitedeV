<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="legiteDev — full-stack, automatyzacja, AI tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#06b6d4;#7c3aed" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#7c3aed;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="1050" cy="60" r="180" fill="url(#accent)" opacity="0.12"/>
  <circle cx="120" cy="280" r="140" fill="url(#accent)" opacity="0.08"/>
  <text x="80" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">legite<tspan fill="url(#accent)">Dev</tspan></text>
  <text x="83" y="196" font-family="'Cascadia Code','SF Mono',Consolas,monospace" font-size="21" fill="#94a3b8">full-stack&#160;&#160;·&#160;&#160;automatyzacja&#160;&#160;·&#160;&#160;AI tooling</text>
  <rect x="83" y="218" width="240" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="240;420;240" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="1120" y="270" text-anchor="end" font-family="'Cascadia Code','SF Mono',Consolas,monospace" font-size="15" fill="#475569">legitedev.pl</text>
</svg>
